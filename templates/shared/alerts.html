{% with messages = get_flashed_messages(with_categories=true) %}

    {% if messages %}

        <div class="flash-container">

            {% for category, message in messages %}

                <div class="flash-message {{ category }}">

                    <span>
                        {{ message }}
                    </span>

                    <button
                        type="button"
                        onclick="this.parentElement.remove()">
                        ×
                    </button>

                </div>

            {% endfor %}

        </div>

    {% endif %}

{% endwith %}
