<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#16a34a">

    <meta name="description"
          content="TurfX - Smart Turf Booking and Cricket Tournament Management">

    <title>{% block title %}TurfX{% endblock %}</title>

    <!-- Global CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/responsive.css') }}">

    <!-- Page Specific CSS -->
    {% block extra_css %}{% endblock %}

</head>

<body>

{% block body %}{% endblock %}

<!-- Global JS -->
<script src="{{ url_for('static', filename='js/script.js') }}"></script>

<!-- Page Specific JS -->
{% block extra_js %}{% endblock %}

</body>
</html>
